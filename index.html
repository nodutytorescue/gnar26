<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Training">
  <title>Training Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input, select, textarea, button { font-size: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Simple icon components
    const ChevronRight = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    );
    const Target = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" />
      </svg>
    );
    const Check = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    );
    const X = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );
    const Circle = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <circle cx="12" cy="12" r="10" />
      </svg>
    );
    const Calendar = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />
      </svg>
    );
    const Plus = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 5v14M5 12h14" />
      </svg>
    );
    const Trash2 = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6" />
      </svg>
    );

    // Storage wrapper using localStorage
    const storage = {
      get: (key) => {
        try {
          const value = localStorage.getItem(key);
          return value ? { value } : null;
        } catch (e) {
          return null;
        }
      },
      set: (key, value) => {
        try {
          localStorage.setItem(key, value);
          return { key, value };
        } catch (e) {
          return null;
        }
      }
    };

    const AnnualTrainingCalendar = () => {
      const [view, setView] = useState('annual');
      const [selectedMonth, setSelectedMonth] = useState(null);
      const [selectedDay, setSelectedDay] = useState(null);
      const [selectedDate, setSelectedDate] = useState(null);
      const [trackingData, setTrackingData] = useState({});
      const [workoutStatus, setWorkoutStatus] = useState(null);
      const [workoutNotes, setWorkoutNotes] = useState('');
      const [editingDay, setEditingDay] = useState(null);
      const [tempSession, setTempSession] = useState('');
      const [customGoals, setCustomGoals] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [selectedGoal, setSelectedGoal] = useState(null);
      const [showNewGoalForm, setShowNewGoalForm] = useState(false);
      const [newGoalName, setNewGoalName] = useState('');
      const [newGoalStartDate, setNewGoalStartDate] = useState('2025-01-01');
      const [newGoalEndDate, setNewGoalEndDate] = useState('2025-12-31');
      const [editingGoalData, setEditingGoalData] = useState(null);
      const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);

      useEffect(() => {
        const loadAllData = async () => {
          setIsLoading(true);
          await Promise.all([loadTrackingData(), loadCustomGoals()]);
          setIsLoading(false);
        };
        loadAllData();
      }, []);

      const loadCustomGoals = async () => {
        try {
          const result = storage.get('custom-goals-v2');
          if (result && result.value) {
            setCustomGoals(JSON.parse(result.value));
          }
        } catch (error) {
          console.log('No custom goals data');
        }
      };

      const saveCustomGoals = async (newData) => {
        try {
          storage.set('custom-goals-v2', JSON.stringify(newData));
          setCustomGoals(newData);
          return true;
        } catch (error) {
          console.error('Failed to save custom goals:', error);
          return false;
        }
      };

      const loadTrackingData = async () => {
        try {
          const result = storage.get('training-tracking');
          if (result && result.value) {
            setTrackingData(JSON.parse(result.value));
          }
        } catch (error) {
          console.log('No existing tracking data');
        }
      };

      const saveTracking = async (month, date, status, notes) => {
        const key = `${month}-${date}`;
        const newData = { ...trackingData, [key]: { status, notes, timestamp: new Date().toISOString() } };
        try {
          storage.set('training-tracking', JSON.stringify(newData));
          setTrackingData(newData);
          return true;
        } catch (error) {
          console.error('Failed to save tracking:', error);
          return false;
        }
      };

      const getTrackingForDate = (month, date) => {
        const key = `${month}-${date}`;
        return trackingData[key] || null;
      };

      const createGoal = async () => {
        if (!newGoalName.trim()) return;
        const defaultWeekStructure = [
          { day: "Sunday", session: "Main session", intensity: 4 },
          { day: "Monday", session: "Easy / recovery", intensity: 1 },
          { day: "Tuesday", session: "Recovery", intensity: 0 },
          { day: "Wednesday", session: "Strength", intensity: 3 },
          { day: "Thursday", session: "Recovery", intensity: 0 },
          { day: "Friday", session: "Secondary session", intensity: 3 },
          { day: "Saturday", session: "Activity / rest", intensity: 2 }
        ];
        const newGoal = {
          id: Date.now().toString(),
          name: newGoalName,
          startDate: newGoalStartDate,
          endDate: newGoalEndDate,
          items: [],
          weekStructure: defaultWeekStructure,
          color: getRandomColor()
        };
        const newGoals = [...customGoals, newGoal];
        await saveCustomGoals(newGoals);
        setShowNewGoalForm(false);
        setNewGoalName('');
        setSelectedGoal(newGoal.id);
        setView('goal-detail');
      };

      const updateGoalWeekday = async (goalId, dayIndex, field, value) => {
        const newGoals = customGoals.map(g => {
          if (g.id === goalId) {
            const newWeekStructure = g.weekStructure.map((day, idx) =>
              idx === dayIndex ? { ...day, [field]: value } : day
            );
            return { ...g, weekStructure: newWeekStructure };
          }
          return g;
        });
        await saveCustomGoals(newGoals);
      };

      const startEditingGoal = (goal) => {
        setEditingGoalData({
          ...goal,
          weekStructure: goal.weekStructure.map(day => ({ ...day })),
          items: [...goal.items]
        });
        setHasUnsavedChanges(false);
      };

      const updateEditingGoalField = (field, value) => {
        setEditingGoalData(prev => ({ ...prev, [field]: value }));
        setHasUnsavedChanges(true);
      };

      const updateEditingWeekday = (dayIndex, field, value) => {
        setEditingGoalData(prev => ({
          ...prev,
          weekStructure: prev.weekStructure.map((day, idx) =>
            idx === dayIndex ? { ...day, [field]: value } : day
          )
        }));
        setHasUnsavedChanges(true);
      };

      const updateEditingGoalItem = (index, value) => {
        setEditingGoalData(prev => ({
          ...prev,
          items: prev.items.map((item, idx) => idx === index ? value : item)
        }));
        setHasUnsavedChanges(true);
      };

      const addEditingGoalItem = () => {
        setEditingGoalData(prev => ({ ...prev, items: [...prev.items, 'New goal item'] }));
        setHasUnsavedChanges(true);
      };

      const deleteEditingGoalItem = (index) => {
        setEditingGoalData(prev => ({ ...prev, items: prev.items.filter((_, idx) => idx !== index) }));
        setHasUnsavedChanges(true);
      };

      const saveEditingGoal = async () => {
        if (!editingGoalData) return;
        const newGoals = customGoals.map(g => g.id === editingGoalData.id ? editingGoalData : g);
        await saveCustomGoals(newGoals);
        setHasUnsavedChanges(false);
      };

      const discardEditingChanges = () => {
        const originalGoal = customGoals.find(g => g.id === editingGoalData?.id);
        if (originalGoal) startEditingGoal(originalGoal);
      };

      const deleteGoal = async (goalId) => {
        const newGoals = customGoals.filter(g => g.id !== goalId);
        await saveCustomGoals(newGoals);
        if (selectedGoal === goalId) {
          setSelectedGoal(null);
          setView('goals-list');
        }
      };

      const getRandomColor = () => {
        const colors = ['#f97316', '#16a34a', '#9333ea', '#0891b2', '#dc2626', '#ca8a04', '#4f46e5', '#be185d'];
        return colors[Math.floor(Math.random() * colors.length)];
      };

      const formatDateRange = (startDate, endDate) => {
        const start = new Date(startDate + 'T00:00:00');
        const end = new Date(endDate + 'T00:00:00');
        const options = { month: 'short', day: 'numeric' };
        return `${start.toLocaleDateString('en-US', options)} - ${end.toLocaleDateString('en-US', options)}`;
      };

      const getGoalsForMonth = (monthName) => {
        const monthIndex = {
          'January': 0, 'February': 1, 'March': 2, 'April': 3,
          'May': 4, 'June': 5, 'July': 6, 'August': 7,
          'September': 8, 'October': 9, 'November': 10, 'December': 11
        }[monthName];
        return customGoals.filter(goal => {
          const startParts = goal.startDate.split('-');
          const endParts = goal.endDate.split('-');
          const startMonth = parseInt(startParts[1], 10) - 1;
          const endMonth = parseInt(endParts[1], 10) - 1;
          return monthIndex >= startMonth && monthIndex <= endMonth;
        });
      };

      const getMonthsForGoal = (goal) => {
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const startParts = goal.startDate.split('-');
        const endParts = goal.endDate.split('-');
        const startMonth = parseInt(startParts[1], 10) - 1;
        const endMonth = parseInt(endParts[1], 10) - 1;
        const months = [];
        for (let i = startMonth; i <= endMonth; i++) months.push(monthNames[i]);
        return months;
      };

      const getDaysInMonth = (monthName) => {
        const monthIndex = {
          'January': 0, 'February': 1, 'March': 2, 'April': 3,
          'May': 4, 'June': 5, 'July': 6, 'August': 7,
          'September': 8, 'October': 9, 'November': 10, 'December': 11
        }[monthName];
        const year = 2025;
        return new Date(year, monthIndex + 1, 0).getDate();
      };

      const getFirstDayOfMonth = (monthName) => {
        const monthIndex = {
          'January': 0, 'February': 1, 'March': 2, 'April': 3,
          'May': 4, 'June': 5, 'July': 6, 'August': 7,
          'September': 8, 'October': 9, 'November': 10, 'December': 11
        }[monthName];
        const year = 2025;
        return new Date(year, monthIndex, 1).getDay();
      };

      const getSessionColor = (intensity) => {
        const level = parseInt(intensity) || 0;
        if (level === 0) return 'bg-gray-50 border-gray-200 text-gray-600';
        if (level === 1) return 'bg-green-50 border-green-200 text-green-700';
        if (level === 2) return 'bg-green-100 border-green-300 text-green-800';
        if (level === 3) return 'bg-yellow-100 border-yellow-300 text-yellow-800';
        if (level === 4) return 'bg-orange-100 border-orange-300 text-orange-800';
        if (level === 5) return 'bg-red-100 border-red-300 text-red-800';
        return 'bg-gray-50 border-gray-200 text-gray-600';
      };

      const getIntensityDots = (intensity) => {
        const level = parseInt(intensity) || 0;
        return '●'.repeat(level) + '○'.repeat(5 - level);
      };

      const getColorForMonth = (monthIndex) => {
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                            'July', 'August', 'September', 'October', 'November', 'December'];
        const monthGoals = getGoalsForMonth(monthNames[monthIndex]);
        if (monthGoals.length > 0) return monthGoals[0].color;
        return '#cbd5e1';
      };

      const createPieSlice = (startAngle, endAngle, color) => {
        const cx = 250, cy = 250, radius = 200, innerRadius = 80;
        const start = (startAngle - 90) * Math.PI / 180;
        const end = (endAngle - 90) * Math.PI / 180;
        const x1 = cx + radius * Math.cos(start);
        const y1 = cy + radius * Math.sin(start);
        const x2 = cx + radius * Math.cos(end);
        const y2 = cy + radius * Math.sin(end);
        const x3 = cx + innerRadius * Math.cos(end);
        const y3 = cy + innerRadius * Math.sin(end);
        const x4 = cx + innerRadius * Math.cos(start);
        const y4 = cy + innerRadius * Math.sin(start);
        const largeArc = endAngle - startAngle > 180 ? 1 : 0;
        const pathData = [
          `M ${x1} ${y1}`,
          `A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2}`,
          `L ${x3} ${y3}`,
          `A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${x4} ${y4}`,
          'Z'
        ].join(' ');
        return <path d={pathData} fill={color} />;
      };

      // Loading
      if (isLoading) {
        return (
          <div className="max-w-6xl mx-auto p-6 bg-gray-50 min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-gray-600">Loading...</p>
            </div>
          </div>
        );
      }

      // Annual View
      if (view === 'annual') {
        const monthAngle = 360 / 12;
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return (
          <div className="max-w-6xl mx-auto p-4 bg-gray-50 min-h-screen">
            <div className="mb-6 text-center">
              <h1 className="text-2xl font-bold mb-1 text-gray-800">Training Calendar</h1>
              <p className="text-gray-600 text-sm">Tap months for plans • Manage goals below</p>
            </div>
            <div className="flex justify-center mb-8">
              <svg width="300" height="300" viewBox="0 0 500 500" className="drop-shadow-lg">
                {Array.from({ length: 12 }).map((_, idx) => {
                  const startAngle = idx * monthAngle;
                  const endAngle = (idx + 1) * monthAngle;
                  const color = getColorForMonth(idx);
                  return <g key={idx}>{createPieSlice(startAngle, endAngle, color)}</g>;
                })}
                {monthNames.map((month, idx) => {
                  const angle = (idx * monthAngle - 90) * Math.PI / 180;
                  const labelRadius = 220;
                  const x = 250 + labelRadius * Math.cos(angle);
                  const y = 250 + labelRadius * Math.sin(angle);
                  const fullMonthName = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][idx];
                  const monthGoals = getGoalsForMonth(fullMonthName);
                  const hasGoals = monthGoals.length > 0;
                  return (
                    <g key={idx} onClick={() => { setSelectedMonth(fullMonthName); setView('monthly'); }} style={{ cursor: 'pointer' }}>
                      <circle cx={x} cy={y} r="20" fill="white" stroke={hasGoals ? monthGoals[0].color : "#cbd5e1"} strokeWidth={hasGoals ? "3" : "2"} />
                      {hasGoals && <circle cx={x + 14} cy={y - 14} r="6" fill={monthGoals[0].color} />}
                      <text x={x} y={y + 4} textAnchor="middle" className="text-xs font-semibold" fill="#374151" style={{ pointerEvents: 'none' }}>{month}</text>
                    </g>
                  );
                })}
                <circle cx="250" cy="250" r="70" fill="white" stroke="#cbd5e1" strokeWidth="2" />
                <text x="250" y="245" textAnchor="middle" className="text-sm font-bold" fill="#374151">2025</text>
                <text x="250" y="260" textAnchor="middle" className="text-xs" fill="#6b7280">Training Year</text>
              </svg>
            </div>
            <div className="flex justify-center">
              <button onClick={() => setView('goals-list')} className="bg-white rounded-lg shadow-md border-2 border-gray-200 p-4 hover:shadow-lg transition-all text-left w-full max-w-md">
                <div className="flex items-center gap-3 mb-2">
                  <Target className="w-6 h-6 text-blue-600" />
                  <h3 className="text-lg font-bold text-gray-800">Goals</h3>
                </div>
                <p className="text-sm text-gray-600 mb-2">
                  {customGoals.length === 0 ? 'Create and track your training goals' : `${customGoals.length} goal${customGoals.length !== 1 ? 's' : ''} defined`}
                </p>
                <div className="flex items-center gap-2 text-sm text-blue-600 font-semibold">
                  <ChevronRight className="w-4 h-4" /> Manage Goals
                </div>
              </button>
            </div>
          </div>
        );
      }

      // Goals List View
      if (view === 'goals-list') {
        return (
          <div className="max-w-4xl mx-auto p-4 bg-gray-50 min-h-screen">
            <button onClick={() => setView('annual')} className="mb-4 text-gray-600 hover:text-gray-800 flex items-center gap-2">← Back</button>
            <div className="flex justify-between items-center mb-4">
              <h1 className="text-2xl font-bold text-gray-800">Goals</h1>
              <button onClick={() => setShowNewGoalForm(true)} className="bg-blue-600 text-white px-3 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2">
                <Plus className="w-5 h-5" /> New
              </button>
            </div>
            {showNewGoalForm && (
              <div className="bg-white rounded-lg shadow-md p-4 mb-4 border-2 border-blue-200">
                <h2 className="text-lg font-bold text-gray-800 mb-3">Create New Goal</h2>
                <div className="space-y-3">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Goal Name</label>
                    <input type="text" value={newGoalName} onChange={(e) => setNewGoalName(e.target.value)} placeholder="e.g., Build climbing endurance" className="w-full border rounded-lg px-3 py-2" autoFocus />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Start</label>
                      <input type="date" value={newGoalStartDate} onChange={(e) => setNewGoalStartDate(e.target.value)} className="w-full border rounded-lg px-3 py-2" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">End</label>
                      <input type="date" value={newGoalEndDate} onChange={(e) => setNewGoalEndDate(e.target.value)} className="w-full border rounded-lg px-3 py-2" />
                    </div>
                  </div>
                  <div className="flex gap-3 justify-end">
                    <button onClick={() => { setShowNewGoalForm(false); setNewGoalName(''); }} className="px-4 py-2 text-gray-600">Cancel</button>
                    <button onClick={createGoal} disabled={!newGoalName.trim()} className={`px-4 py-2 rounded-lg ${newGoalName.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-200 text-gray-400'}`}>Create</button>
                  </div>
                </div>
              </div>
            )}
            {customGoals.length === 0 && !showNewGoalForm ? (
              <div className="bg-white rounded-lg shadow-md p-8 text-center">
                <Target className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                <h2 className="text-xl font-semibold text-gray-600 mb-2">No goals yet</h2>
                <p className="text-gray-500 mb-4">Create your first goal to start</p>
                <button onClick={() => setShowNewGoalForm(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Create Goal</button>
              </div>
            ) : (
              <div className="space-y-3">
                {customGoals.map((goal) => {
                  const months = getMonthsForGoal(goal);
                  return (
                    <div key={goal.id} className="bg-white rounded-lg shadow-md border-l-4 overflow-hidden" style={{ borderLeftColor: goal.color }}>
                      <div className="p-4 cursor-pointer" onClick={() => { setSelectedGoal(goal.id); setView('goal-detail'); }}>
                        <div className="flex justify-between items-start">
                          <div className="flex-1">
                            <h3 className="text-lg font-bold text-gray-800">{goal.name}</h3>
                            <div className="flex items-center gap-2 text-sm text-gray-500 mt-1">
                              <Calendar className="w-4 h-4" />{formatDateRange(goal.startDate, goal.endDate)}
                            </div>
                            <div className="flex flex-wrap gap-1 mt-2">
                              {months.map((month) => (
                                <span key={month} className="text-xs px-2 py-0.5 rounded-full text-white" style={{ backgroundColor: goal.color }}>{month}</span>
                              ))}
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={(e) => { e.stopPropagation(); if (confirm('Delete this goal?')) deleteGoal(goal.id); }} className="p-2 text-gray-400 hover:text-red-600">
                              <Trash2 className="w-5 h-5" />
                            </button>
                            <ChevronRight className="w-5 h-5 text-gray-400" />
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      }

      // Goal Detail View
      if (view === 'goal-detail' && selectedGoal) {
        const goal = customGoals.find(g => g.id === selectedGoal);
        if (!goal) { setView('goals-list'); return null; }
        if (!editingGoalData || editingGoalData.id !== goal.id) { startEditingGoal(goal); return null; }
        const data = editingGoalData;
        return (
          <div className="max-w-4xl mx-auto p-4 bg-gray-50 min-h-screen pb-24">
            <div className="flex justify-between items-center mb-4">
              <button onClick={() => { if (hasUnsavedChanges) { if (confirm('Discard changes?')) { setEditingGoalData(null); setHasUnsavedChanges(false); setView('goals-list'); } } else { setEditingGoalData(null); setView('goals-list'); } }} className="text-gray-600 hover:text-gray-800 flex items-center gap-2">← Back</button>
              {hasUnsavedChanges && (
                <div className="flex items-center gap-2">
                  <button onClick={discardEditingChanges} className="px-3 py-1 text-gray-600 text-sm">Discard</button>
                  <button onClick={saveEditingGoal} className="px-3 py-1 bg-blue-600 text-white rounded-lg text-sm">Save</button>
                </div>
              )}
            </div>
            <div className="p-4 rounded-lg mb-4 text-white" style={{ backgroundColor: data.color }}>
              <input type="text" value={data.name} onChange={(e) => updateEditingGoalField('name', e.target.value)} className="w-full bg-transparent text-2xl font-bold mb-2 border-b border-white/30 focus:border-white outline-none" />
              <div className="flex items-center gap-2 text-sm opacity-90 mb-2">
                <Calendar className="w-4 h-4" />{formatDateRange(data.startDate, data.endDate)}
              </div>
              <div className="flex gap-3">
                <div>
                  <label className="text-xs opacity-70">Start</label>
                  <input type="date" value={data.startDate} onChange={(e) => updateEditingGoalField('startDate', e.target.value)} className="block bg-white/20 border border-white/40 rounded px-2 py-1 text-white text-sm" />
                </div>
                <div>
                  <label className="text-xs opacity-70">End</label>
                  <input type="date" value={data.endDate} onChange={(e) => updateEditingGoalField('endDate', e.target.value)} className="block bg-white/20 border border-white/40 rounded px-2 py-1 text-white text-sm" />
                </div>
              </div>
            </div>
            <div className="bg-white rounded-lg shadow-md p-4 mb-4">
              <h2 className="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2"><Target className="w-5 h-5" />Goal Items</h2>
              {data.items.length === 0 ? <p className="text-gray-500 mb-3 text-sm">No items yet.</p> : (
                <ul className="space-y-2 mb-3">
                  {data.items.map((item, idx) => (
                    <li key={idx} className="flex items-start gap-2 text-gray-700">
                      <ChevronRight className="w-4 h-4 mt-2 text-blue-600 flex-shrink-0" />
                      <input type="text" value={item} onChange={(e) => updateEditingGoalItem(idx, e.target.value)} className="flex-1 border rounded px-2 py-1 text-sm" />
                      <button onClick={() => deleteEditingGoalItem(idx)} className="p-1 text-red-400 hover:text-red-600"><X className="w-4 h-4" /></button>
                    </li>
                  ))}
                </ul>
              )}
              <button onClick={addEditingGoalItem} className="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1"><Plus className="w-4 h-4" /> Add item</button>
            </div>
            <div className="bg-white rounded-lg shadow-md p-4">
              <h2 className="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><Calendar className="w-5 h-5" />Weekly Plan</h2>
              <p className="text-xs text-gray-500 mb-3">Schedule for all weeks in this goal</p>
              <div className="space-y-2">
                {data.weekStructure?.map((dayInfo, idx) => (
                  <div key={idx} className={`p-3 rounded-lg border-2 ${getSessionColor(dayInfo.intensity)}`}>
                    <div className="flex flex-col gap-2">
                      <div className="flex items-center gap-2">
                        <span className="font-semibold w-16 text-sm">{dayInfo.day.slice(0,3)}</span>
                        <input type="text" value={dayInfo.session} onChange={(e) => updateEditingWeekday(idx, 'session', e.target.value)} className="flex-1 bg-transparent border-b border-current/30 focus:border-current outline-none px-1 text-sm" />
                      </div>
                      <div className="flex items-center gap-1 ml-16">
                        {[0, 1, 2, 3, 4, 5].map((level) => (
                          <button key={level} onClick={() => updateEditingWeekday(idx, 'intensity', level)} className={`w-7 h-7 rounded text-xs font-bold ${dayInfo.intensity === level ? 'ring-2 ring-offset-1 ring-blue-500' : ''}`}
                            style={{ backgroundColor: level === 0 ? '#e5e7eb' : level <= 2 ? '#22c55e' : level <= 3 ? '#eab308' : level <= 4 ? '#f97316' : '#ef4444', color: level === 0 ? '#6b7280' : 'white' }}>
                            {level === 0 ? 'R' : level}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            {hasUnsavedChanges && (
              <div className="fixed bottom-4 right-4">
                <button onClick={saveEditingGoal} className="px-5 py-3 bg-blue-600 text-white rounded-lg shadow-lg hover:bg-blue-700 flex items-center gap-2">
                  <Check className="w-5 h-5" />Save
                </button>
              </div>
            )}
          </div>
        );
      }

      // Monthly View
      if (view === 'monthly' && selectedMonth) {
        const daysInMonth = getDaysInMonth(selectedMonth);
        const firstDay = getFirstDayOfMonth(selectedMonth);
        const activeGoals = getGoalsForMonth(selectedMonth);
        const activeGoal = activeGoals.length > 0 ? activeGoals[0] : null;
        const weekStructure = activeGoal?.weekStructure || null;
        return (
          <div className="max-w-6xl mx-auto p-4 bg-gray-50 min-h-screen">
            <button onClick={() => setView('annual')} className="mb-4 text-gray-600 hover:text-gray-800 flex items-center gap-2">← Back</button>
            <div className="mb-4">
              <h1 className="text-2xl font-bold text-gray-800 mb-1">{selectedMonth} 2025</h1>
              {activeGoal && (
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-white text-sm" style={{ backgroundColor: activeGoal.color }}>
                  <Target className="w-4 h-4" />{activeGoal.name}
                </div>
              )}
            </div>
            {!activeGoal && (
              <div className="bg-white rounded-lg shadow-md p-8 text-center">
                <Target className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                <h2 className="text-xl font-semibold text-gray-600 mb-2">No goal for {selectedMonth}</h2>
                <p className="text-gray-500 mb-4">Create a goal that covers this month</p>
                <button onClick={() => setView('goals-list')} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Create Goal</button>
              </div>
            )}
            {activeGoal && weekStructure && (
              <>
                {activeGoal.items.length > 0 && (
                  <div className="mb-4 p-3 rounded-lg border-l-4 bg-white shadow-sm cursor-pointer" style={{ borderLeftColor: activeGoal.color }} onClick={() => { setSelectedGoal(activeGoal.id); setView('goal-detail'); }}>
                    <h3 className="font-semibold text-gray-800 mb-1 text-sm">Goal Focus</h3>
                    <ul className="space-y-1">
                      {activeGoal.items.slice(0, 2).map((item, idx) => (
                        <li key={idx} className="text-xs text-gray-600 flex items-center gap-2">
                          <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: activeGoal.color }} />{item}
                        </li>
                      ))}
                      {activeGoal.items.length > 2 && <li className="text-xs text-gray-400">+{activeGoal.items.length - 2} more</li>}
                    </ul>
                  </div>
                )}
                <div className="bg-white rounded-lg shadow-md p-4">
                  <h2 className="text-lg font-bold text-gray-800 mb-3">Training Plan</h2>
                  <div className="grid grid-cols-7 gap-1 mb-4">
                    {weekStructure.map((dayInfo, idx) => (
                      <div key={idx} className="flex flex-col items-center">
                        <span className="font-semibold text-xs text-gray-700 mb-1">{dayInfo.day.slice(0, 2)}</span>
                        <div className={`p-1 rounded border-2 ${getSessionColor(dayInfo.intensity)} min-h-14 w-full flex flex-col`}>
                          <p className="text-[9px] leading-tight flex-1">{dayInfo.session}</p>
                          <span className="text-[8px] opacity-60">{getIntensityDots(dayInfo.intensity)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="border-t border-gray-200 pt-4">
                    <h2 className="text-lg font-bold text-gray-800 mb-3">Track Workouts</h2>
                    <div className="grid grid-cols-7 gap-1">
                      {Array.from({ length: firstDay }).map((_, idx) => <div key={`empty-${idx}`} className="aspect-square" />)}
                      {Array.from({ length: daysInMonth }).map((_, idx) => {
                        const date = idx + 1;
                        const tracking = getTrackingForDate(selectedMonth, date);
                        return (
                          <button key={date} onClick={() => { setSelectedDate(date); setWorkoutStatus(tracking?.status || null); setWorkoutNotes(tracking?.notes || ''); setView('tracking'); }}
                            className={`aspect-square rounded-lg border-2 flex flex-col items-center justify-center text-xs transition-all ${
                              tracking?.status === 'completed' ? 'bg-green-100 border-green-400' :
                              tracking?.status === 'partial' ? 'bg-yellow-100 border-yellow-400' :
                              tracking?.status === 'skipped' ? 'bg-red-100 border-red-400' :
                              'bg-gray-50 border-gray-200'
                            }`}>
                            <span className="font-bold">{date}</span>
                            {tracking?.status && (
                              <span className="mt-0.5">
                                {tracking.status === 'completed' && <Check className="w-2 h-2 text-green-600" />}
                                {tracking.status === 'partial' && <Circle className="w-2 h-2 text-yellow-600" />}
                                {tracking.status === 'skipped' && <X className="w-2 h-2 text-red-600" />}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>
        );
      }

      // Tracking View
      if (view === 'tracking' && selectedDate && selectedMonth) {
        const activeGoals = getGoalsForMonth(selectedMonth);
        const activeGoal = activeGoals.length > 0 ? activeGoals[0] : null;
        const firstDay = getFirstDayOfMonth(selectedMonth);
        const dayOfWeek = (firstDay + selectedDate - 1) % 7;
        const dayInfo = activeGoal?.weekStructure?.[dayOfWeek];
        return (
          <div className="max-w-2xl mx-auto p-4 bg-gray-50 min-h-screen">
            <button onClick={() => setView('monthly')} className="mb-4 text-gray-600 hover:text-gray-800 flex items-center gap-2">← Back</button>
            <div className="mb-4">
              <h1 className="text-2xl font-bold text-gray-800">{selectedMonth} {selectedDate}</h1>
              {dayInfo && <p className="text-gray-600">{dayInfo.day} - {dayInfo.session}</p>}
            </div>
            <div className="bg-white rounded-lg shadow-md p-4 space-y-4">
              <div>
                <h2 className="font-bold text-gray-800 mb-2">How did it go?</h2>
                <div className="flex gap-2">
                  {[
                    { status: 'completed', label: 'Done', color: 'green' },
                    { status: 'partial', label: 'Partial', color: 'yellow' },
                    { status: 'skipped', label: 'Skipped', color: 'red' }
                  ].map(({ status, label, color }) => (
                    <button key={status} onClick={() => setWorkoutStatus(status)}
                      className={`flex-1 p-3 rounded-lg border-2 transition-all ${workoutStatus === status ? `bg-${color}-100 border-${color}-400` : 'bg-gray-50 border-gray-200'}`}>
                      <span className="text-sm">{label}</span>
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <h2 className="font-bold text-gray-800 mb-2">Notes</h2>
                <textarea value={workoutNotes} onChange={(e) => setWorkoutNotes(e.target.value)} placeholder="How did you feel?" className="w-full p-3 border rounded-lg resize-none h-24" />
              </div>
              <button onClick={async () => { if (workoutStatus) { await saveTracking(selectedMonth, selectedDate, workoutStatus, workoutNotes); setView('monthly'); } }} disabled={!workoutStatus}
                className={`w-full p-3 rounded-lg font-semibold ${workoutStatus ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-400'}`}>
                Save
              </button>
            </div>
          </div>
        );
      }

      return null;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<AnnualTrainingCalendar />);
  </script>
</body>
</html>
